[tool.poetry]
name = "magicpin-vera-bot"
version = "0.1.0"
description = "Vera message engine for the magicpin AI Challenge"
authors = ["Team Alpha"]
packages = [{ include = "*.py" }]

[tool.poetry.dependencies]
# 3.13, not "^3.11". pydantic-core 2.27.2 ships prebuilt wheels for cp310-cp313
# only, so a resolver that allows 3.14 ends up compiling it from Rust, which
# fails on hosts with a read-only cargo registry (Render) and is slow
# everywhere else. Matched by .python-version and PYTHON_VERSION in render.yaml.
python = "~3.13"
fastapi = "0.115.6"
uvicorn = { version = "0.34.0", extras = ["standard"] }
pydantic = "2.10.4"
httpx = "0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
