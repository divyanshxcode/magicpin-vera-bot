[tool.poetry]
name = "magicpin-vera-bot"
version = "0.1.0"
description = "Vera message engine for the magicpin AI Challenge"
authors = ["Team Alpha"]
packages = [{ include = "*.py" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.6"
uvicorn = { version = "0.34.0", extras = ["standard"] }
pydantic = "2.10.4"
httpx = "0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
